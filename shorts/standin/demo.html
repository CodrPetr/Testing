<!doctype html><html><head><meta charset="utf-8"><title>Stand-in arena</title>
<style>html,body{margin:0;background:#07080c;overflow:hidden}canvas{display:block}
#hud{position:fixed;top:24px;left:24px;color:#e8e6ff;font:900 54px Inter,Arial,sans-serif;letter-spacing:2px;text-shadow:0 0 18px #7c5cff}</style></head>
<body><canvas id=c></canvas><div id=hud>SCORE 0</div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
const P={x:0,y:0,a:0},E=[],B=[],X=[],S=[];let score=0,t0=performance.now(),shake=0;
for(let i=0;i<140;i++)S.push({x:Math.random(),y:Math.random(),z:.3+Math.random()});
function spawn(){const ang=Math.random()*6.283,r=Math.max(W,H)*.6;E.push({x:W/2+Math.cos(ang)*r,y:H/2+Math.sin(ang)*r,s:38+Math.random()*30,hp:2,h:Math.random()*60+320})}
function boom(x,y,col,n=26){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=2+Math.random()*9;X.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,col})}shake=10}
let last=t0;function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const T=(now-t0)/1000;
P.x=W/2+Math.sin(T*1.3)*W*.22;P.y=H/2+Math.cos(T*1.1)*H*.2;P.a+=dt*3;
if(Math.random()<.06+T*.004)spawn();
if(Math.random()<.35){const tgt=E[0];if(tgt){const a=Math.atan2(tgt.y-P.y,tgt.x-P.x);B.push({x:P.x,y:P.y,vx:Math.cos(a)*16,vy:Math.sin(a)*16,l:1})}}
g.fillStyle='rgba(7,8,12,.42)';g.fillRect(0,0,W,H);
g.save();if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85}
for(const s of S){s.x-=dt*.02*s.z;if(s.x<0)s.x=1;g.fillStyle=`rgba(180,170,255,${.25*s.z})`;g.fillRect(s.x*W,s.y*H,2*s.z,2*s.z)}
for(const e of E){const a=Math.atan2(P.y-e.y,P.x-e.x);e.x+=Math.cos(a)*140*dt;e.y+=Math.sin(a)*140*dt;
g.shadowBlur=30;g.shadowColor=`hsl(${e.h} 100% 60%)`;g.fillStyle=`hsl(${e.h} 90% 55%)`;g.beginPath();for(let i=0;i<6;i++){const q=T*2+i*1.047;g.lineTo(e.x+Math.cos(q)*e.s,e.y+Math.sin(q)*e.s)}g.closePath();g.fill()}
for(const b of B){b.x+=b.vx;b.y+=b.vy;b.l-=dt*1.2;g.shadowBlur=20;g.shadowColor='#8ff';g.fillStyle='#dff';g.fillRect(b.x-5,b.y-5,10,10);
for(const e of E){if(Math.hypot(e.x-b.x,e.y-b.y)<e.s){e.hp--;b.l=0;boom(b.x,b.y,'#9ff',8);if(e.hp<=0){e.dead=1;score+=100;boom(e.x,e.y,`hsl(${e.h} 100% 65%)`,40)}}}}
for(const x of X){x.x+=x.vx;x.y+=x.vy;x.vx*=.96;x.vy*=.96;x.l-=dt*1.6;g.shadowBlur=14;g.shadowColor=x.col;g.fillStyle=x.col;g.globalAlpha=Math.max(0,x.l);g.fillRect(x.x,x.y,7,7)}g.globalAlpha=1;
g.shadowBlur=40;g.shadowColor='#7c5cff';g.fillStyle='#fff';g.save();g.translate(P.x,P.y);g.rotate(P.a);g.beginPath();g.moveTo(34,0);g.lineTo(-22,22);g.lineTo(-10,0);g.lineTo(-22,-22);g.closePath();g.fill();g.restore();
g.restore();
for(let i=E.length-1;i>=0;i--)if(E[i].dead)E.splice(i,1);for(let i=B.length-1;i>=0;i--)if(B[i].l<=0)B.splice(i,1);for(let i=X.length-1;i>=0;i--)if(X[i].l<=0)X.splice(i,1);
if(E.length>18)E.length=18;document.getElementById('hud').textContent='SCORE '+score;requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
